<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Exploration Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: light dark;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            }
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.5s ease-out;
        }

        @media (prefers-color-scheme: dark) {
            .container {
                background: rgba(20, 20, 40, 0.95);
                color: #e0e0e0;
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @media (prefers-color-scheme: dark) {
            .title {
                background: linear-gradient(135deg, #a78bfa 0%, #d8b4fe 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
        }

        .subtitle {
            font-size: 14px;
            opacity: 0.7;
        }

        .score-counter {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 12px;
        }

        @media (prefers-color-scheme: dark) {
            .score-counter {
                background: rgba(167, 139, 250, 0.1);
            }
        }

        .score-text {
            font-weight: 600;
            font-size: 16px;
        }

        .progress-container {
            margin-bottom: 25px;
        }

        .progress-label {
            font-size: 13px;
            margin-bottom: 8px;
            opacity: 0.7;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        @media (prefers-color-scheme: dark) {
            .progress-bar {
                background: rgba(255, 255, 255, 0.1);
            }
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.4s ease;
            border-radius: 4px;
        }

        .question-section {
            margin-bottom: 30px;
        }

        .question-number {
            font-size: 13px;
            opacity: 0.6;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            padding: 12px 16px;
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.03);
            font-size: 15px;
            font-weight: 500;
        }

        @media (prefers-color-scheme: dark) {
            .option {
                background: rgba(255, 255, 255, 0.05);
            }
        }

        .option:hover:not(.disabled) {
            border-color: #667eea;
            transform: translateX(4px);
        }

        .option.selected {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.15);
            font-weight: 600;
        }

        .option.correct {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.15);
            animation: pulse-correct 0.6s ease;
        }

        .option.incorrect {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.15);
            animation: shake 0.5s ease;
        }

        .option.disabled {
            cursor: not-allowed;
        }

        @keyframes pulse-correct {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .feedback {
            margin-top: 15px;
            padding: 12px 14px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            animation: slideIn 0.4s ease-out;
        }

        .feedback.correct {
            background: rgba(16, 185, 129, 0.2);
            color: #047857;
        }

        @media (prefers-color-scheme: dark) {
            .feedback.correct {
                color: #86efac;
            }
        }

        .feedback.incorrect {
            background: rgba(239, 68, 68, 0.2);
            color: #991b1b;
        }

        @media (prefers-color-scheme: dark) {
            .feedback.incorrect {
                color: #fca5a5;
            }
        }

        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(0, 0, 0, 0.1);
            color: inherit;
        }

        @media (prefers-color-scheme: dark) {
            .btn-secondary {
                background: rgba(255, 255, 255, 0.1);
            }
        }

        .btn-secondary:hover {
            background: rgba(0, 0, 0, 0.15);
        }

        @media (prefers-color-scheme: dark) {
            .btn-secondary:hover {
                background: rgba(255, 255, 255, 0.15);
            }
        }

        .results-screen {
            text-align: center;
            animation: slideIn 0.5s ease-out;
        }

        .results-emoji {
            font-size: 80px;
            margin-bottom: 20px;
            display: inline-block;
            animation: bounce 1s ease-in-out;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .results-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .results-score {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
        }

        @media (prefers-color-scheme: dark) {
            .results-score {
                background: linear-gradient(135deg, #a78bfa 0%, #d8b4fe 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
        }

        .results-message {
            font-size: 16px;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .hidden {
            display: none;
        }

        .emoji-reaction {
            font-size: 24px;
            margin-right: 8px;
        }

        .review-screen {
            animation: slideIn 0.5s ease-out;
        }

        .review-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .review-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .review-subtitle {
            font-size: 14px;
            opacity: 0.7;
        }

        .review-item {
            margin-bottom: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.03);
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }

        @media (prefers-color-scheme: dark) {
            .review-item {
                background: rgba(255, 255, 255, 0.05);
            }
        }

        .review-item.correct {
            border-left-color: #10b981;
        }

        .review-item.incorrect {
            border-left-color: #ef4444;
        }

        .review-question-text {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .review-answers {
            margin-bottom: 12px;
        }

        .review-answer {
            font-size: 14px;
            margin-bottom: 6px;
            padding: 8px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.02);
        }

        @media (prefers-color-scheme: dark) {
            .review-answer {
                background: rgba(255, 255, 255, 0.02);
            }
        }

        .review-answer.user-answer {
            font-weight: 500;
        }

        .review-answer.user-answer.correct {
            color: #047857;
        }

        @media (prefers-color-scheme: dark) {
            .review-answer.user-answer.correct {
                color: #86efac;
            }
        }

        .review-answer.user-answer.incorrect {
            color: #991b1b;
        }

        @media (prefers-color-scheme: dark) {
            .review-answer.user-answer.incorrect {
                color: #fca5a5;
            }
        }

        .review-answer.correct-answer {
            font-weight: 500;
            color: #047857;
        }

        @media (prefers-color-scheme: dark) {
            .review-answer.correct-answer {
                color: #86efac;
            }
        }

        .review-explanation {
            margin-top: 12px;
            padding: 12px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        @media (prefers-color-scheme: dark) {
            .review-explanation {
                background: rgba(167, 139, 250, 0.1);
            }
        }

        .review-pagination {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            .review-pagination {
                border-top-color: rgba(255, 255, 255, 0.1);
            }
        }

        .review-page-info {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 15px;
        }

        .review-nav-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .review-nav-buttons button {
            flex: 0 1 auto;
            min-width: 120px;
        }

        .review-finish-button {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="quizContent">
            <div class="header">
                <div class="title">🚀 Space Explorer</div>
                <div class="subtitle">Test your cosmic knowledge</div>
            </div>

            <div class="score-counter">
                <span class="score-text">Score: <span id="scoreValue">0</span>/10</span>
                <span class="score-text">Correct: <span id="correctCount">0</span></span>
            </div>

            <div class="progress-container">
                <div class="progress-label">
                    <span>Progress</span>
                    <span id="progressText">0/10</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div id="quizContainer"></div>

            <div class="button-container">
                <button id="prevBtn" class="btn-secondary" onclick="previousQuestion()">← Previous</button>
                <button id="nextBtn" class="btn-primary" onclick="nextQuestion()">Next →</button>
            </div>
        </div>

        <div id="resultsContent" class="hidden">
            <div class="results-screen">
                <div class="results-emoji" id="resultEmoji">🎉</div>
                <div class="results-title">Quiz Complete!</div>
                <div class="results-score" id="finalScore">0/10</div>
                <div class="results-message" id="resultMessage">Amazing work!</div>
                <div class="button-container">
                    <button class="btn-primary" onclick="startReview()">Review Answers</button>
                    <button class="btn-secondary" onclick="restartQuiz()">Take Quiz Again</button>
                </div>
            </div>
        </div>

        <div id="reviewContent" class="hidden">
            <div class="review-screen">
                <div class="review-header">
                    <div class="review-title">📚 Review Your Answers</div>
                    <div class="review-subtitle">Learn from each question</div>
                </div>
                <div id="reviewContainer"></div>
                <div class="review-pagination">
                    <div class="review-page-info" id="reviewPageInfo"></div>
                    <div class="review-nav-buttons">
                        <button id="reviewPrevBtn" class="btn-secondary" onclick="reviewPreviousQuestion()">← Previous</button>
                        <button id="reviewNextBtn" class="btn-primary" onclick="reviewNextQuestion()">Next →</button>
                    </div>
                    <div class="button-container review-finish-button">
                        <button class="btn-primary" onclick="restartQuiz()">Take Quiz Again</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "What is the largest planet in our solar system?",
                options: ["Saturn", "Jupiter", "Neptune", "Uranus"],
                correct: 1,
                explanation: "Jupiter is the largest planet, with a mass more than twice that of all other planets combined. Its Great Red Spot is a storm larger than Earth itself."
            },
            {
                question: "How many moons does Mars have?",
                options: ["0", "1", "2", "4"],
                correct: 2,
                explanation: "Mars has two small moons: Phobos and Deimos. Both are irregularly shaped and are believed to be captured asteroids."
            },
            {
                question: "What is the hottest planet in our solar system?",
                options: ["Mercury", "Venus", "Mars", "Earth"],
                correct: 1,
                explanation: "Venus is hotter than Mercury due to its thick atmosphere creating a runaway greenhouse effect. Surface temperature reaches about 900°F (475°C)."
            },
            {
                question: "Which spacecraft was the first to leave the solar system?",
                options: ["Voyager 1", "Voyager 2", "Pioneer 10", "New Horizons"],
                correct: 0,
                explanation: "Voyager 1, launched in 1977, entered interstellar space in 2012 and continues sending data back to Earth today."
            },
            {
                question: "What is the name of the nearest star to Earth?",
                options: ["Sirius", "Proxima Centauri", "Alpha Centauri A", "Betelgeuse"],
                correct: 1,
                explanation: "Proxima Centauri is about 4.24 light-years away. Despite being the closest, it's too faint to see without a telescope."
            },
            {
                question: "In what year did humans first land on the Moon?",
                options: ["1965", "1967", "1969", "1971"],
                correct: 2,
                explanation: "Apollo 11 landed on the Moon on July 20, 1969. Neil Armstrong and Buzz Aldrin became the first humans to walk on the lunar surface."
            },
            {
                question: "What is the smallest planet in our solar system?",
                options: ["Mercury", "Mars", "Venus", "Pluto"],
                correct: 0,
                explanation: "Mercury is the smallest planet and closest to the Sun. It has extreme temperature variations and a thin atmosphere."
            },
            {
                question: "Which gas makes up most of Jupiter's atmosphere?",
                options: ["Oxygen", "Nitrogen", "Hydrogen", "Helium"],
                correct: 2,
                explanation: "Jupiter's atmosphere is composed primarily of hydrogen and helium, similar to the early composition of our Solar System."
            },
            {
                question: "How long does light from the Sun take to reach Earth?",
                options: ["8 minutes", "5 minutes", "12 minutes", "3 minutes"],
                correct: 0,
                explanation: "Light travels at about 186,000 miles per second, covering the 93 million miles between the Sun and Earth in approximately 8 minutes and 20 seconds."
            },
            {
                question: "What is a group of stars called?",
                options: ["Galaxy", "Universe", "Constellation", "Nebula"],
                correct: 2,
                explanation: "A constellation is a pattern of stars visible from Earth. Our Sun is one of 100-200 billion stars in the Milky Way galaxy."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = new Array(questions.length).fill(false);
        let userAnswers = new Array(questions.length).fill(-1);
        let reviewCurrentQuestion = 0;

        function updateProgress() {
            const progress = (currentQuestion + 1) / questions.length;
            document.getElementById("progressFill").style.width = (progress * 100) + "%";
            document.getElementById("progressText").textContent = `${currentQuestion + 1}/${questions.length}`;
        }

        function renderQuestion() {
            const q = questions[currentQuestion];
            const answered_flag = userAnswers[currentQuestion] !== -1;
            const selectedAnswer = userAnswers[currentQuestion];

            let html = `
                <div class="question-section">
                    <div class="question-number">Question ${currentQuestion + 1} of ${questions.length}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options">
            `;

            q.options.forEach((option, index) => {
                let classes = "option";
                if (answered_flag) {
                    classes += " disabled";
                    if (index === q.correct) {
                        classes += " correct";
                    } else if (index === selectedAnswer) {
                        classes += " incorrect";
                    }
                } else if (index === selectedAnswer) {
                    classes += " selected";
                }

                html += `<div class="${classes}" onclick="selectAnswer(${index})" data-index="${index}">${option}</div>`;
            });

            html += `</div>`;

            if (answered_flag) {
                const isCorrect = selectedAnswer === q.correct;
                const feedbackClass = isCorrect ? "correct" : "incorrect";
                const feedbackText = isCorrect ? "✓ Correct!" : "✗ Incorrect";
                html += `<div class="feedback ${feedbackClass}">${feedbackText}</div>`;
            }

            html += `</div>`;
            document.getElementById("quizContainer").innerHTML = html;

            updateProgress();
            updateButtons();
        }

        function selectAnswer(index) {
            if (answered[currentQuestion]) return;

            userAnswers[currentQuestion] = index;
            answered[currentQuestion] = true;

            const isCorrect = index === questions[currentQuestion].correct;
            if (isCorrect) {
                score++;
                document.getElementById("scoreValue").textContent = score;
                document.getElementById("correctCount").textContent = score;
            }

            setTimeout(() => {
                renderQuestion();
            }, 300);
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function updateButtons() {
            document.getElementById("prevBtn").disabled = currentQuestion === 0;
            const isLastQuestion = currentQuestion === questions.length - 1;
            const nextBtn = document.getElementById("nextBtn");
            
            if (isLastQuestion) {
                nextBtn.textContent = "See Results →";
            } else {
                nextBtn.textContent = "Next →";
            }

            nextBtn.disabled = !answered[currentQuestion];
        }

        function showResults() {
            document.getElementById("quizContent").classList.add("hidden");
            document.getElementById("resultsContent").classList.remove("hidden");

            const percentage = Math.round((score / questions.length) * 100);
            document.getElementById("finalScore").textContent = `${score}/${questions.length}`;

            let emoji, message;
            if (percentage === 100) {
                emoji = "🌟";
                message = "Perfect! You're a true space expert!";
            } else if (percentage >= 80) {
                emoji = "🚀";
                message = "Excellent work! You know your cosmos!";
            } else if (percentage >= 60) {
                emoji = "🌙";
                message = "Good job! You're becoming a space explorer!";
            } else if (percentage >= 40) {
                emoji = "🪐";
                message = "Not bad! Keep learning about space!";
            } else {
                emoji = "🌍";
                message = "Keep exploring! Space has much to teach!";
            }

            document.getElementById("resultEmoji").textContent = emoji;
            document.getElementById("resultMessage").innerHTML = `${emoji} ${message}`;
        }

        function startReview() {
            reviewCurrentQuestion = 0;
            document.getElementById("resultsContent").classList.add("hidden");
            document.getElementById("reviewContent").classList.remove("hidden");
            renderReviewQuestion();
        }

        function renderReviewQuestion() {
            const q = questions[reviewCurrentQuestion];
            const userAnswer = userAnswers[reviewCurrentQuestion];
            const isCorrect = userAnswer === q.correct;

            let html = `
                <div class="review-item ${isCorrect ? 'correct' : 'incorrect'}">
                    <div class="question-number">Question ${reviewCurrentQuestion + 1} of ${questions.length}</div>
                    <div class="review-question-text">${q.question}</div>
                    <div class="review-answers">
                        <div class="review-answer user-answer ${isCorrect ? 'correct' : 'incorrect'}">
                            ${isCorrect ? '✓' : '✗'} Your answer: <strong>${q.options[userAnswer]}</strong>
                        </div>
            `;

            if (!isCorrect) {
                html += `<div class="review-answer correct-answer">✓ Correct answer: <strong>${q.options[q.correct]}</strong></div>`;
            }

            html += `
                    </div>
                    <div class="review-explanation">
                        <strong>Learn more:</strong> ${q.explanation}
                    </div>
                </div>
            `;

            document.getElementById("reviewContainer").innerHTML = html;
            document.getElementById("reviewPageInfo").textContent = `Question ${reviewCurrentQuestion + 1} of ${questions.length}`;

            updateReviewButtons();
        }

        function reviewNextQuestion() {
            if (reviewCurrentQuestion < questions.length - 1) {
                reviewCurrentQuestion++;
                renderReviewQuestion();
            }
        }

        function reviewPreviousQuestion() {
            if (reviewCurrentQuestion > 0) {
                reviewCurrentQuestion--;
                renderReviewQuestion();
            }
        }

        function updateReviewButtons() {
            document.getElementById("reviewPrevBtn").disabled = reviewCurrentQuestion === 0;
            document.getElementById("reviewNextBtn").disabled = reviewCurrentQuestion === questions.length - 1;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            answered = new Array(questions.length).fill(false);
            userAnswers = new Array(questions.length).fill(-1);
            reviewCurrentQuestion = 0;

            document.getElementById("scoreValue").textContent = "0";
            document.getElementById("correctCount").textContent = "0";
            document.getElementById("quizContent").classList.remove("hidden");
            document.getElementById("resultsContent").classList.add("hidden");
            document.getElementById("reviewContent").classList.add("hidden");

            renderQuestion();
        }

        renderQuestion();
    </script>
</body>
</html>
